name: Oversold monitor

on:
  schedule:
    # Target: 09:50 America/New_York, every weekday.
    #
    # GitHub cron is UTC-only and has no timezone support, so a single entry
    # would drift by an hour at each daylight-saving switch. Both candidate
    # times are scheduled and the "Check the local time" step below lets only
    # the one that lands near 09:50 ET actually run.
    - cron: '50 13 * * 1-5'   # 09:50 EDT (summer, UTC-4)
    - cron: '50 14 * * 1-5'   # 09:50 EST (winter, UTC-5)
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the cooldown and re-send every current alert'
        type: boolean
        default: false
      always_notify:
        description: 'Send a message even when nothing is oversold'
        type: boolean
        default: false

concurrency:
  group: oversold-monitor
  cancel-in-progress: false

permissions:
  contents: write        # needed to commit the alert state back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this is today's run
        id: window
        # Two problems to solve at once:
        #
        #  * GitHub cron is UTC-only, so one entry would drift an hour at each
        #    daylight-saving switch. Hence two entries, one per offset.
        #  * GitHub's scheduler is best-effort and routinely fires late — this
        #    workflow has been observed starting two hours behind schedule. A
        #    narrow time window would therefore skip both entries and silently
        #    do nothing.
        #
        # So the rule is "not before 09:20 ET, and at most once per weekday":
        # whichever entry lands first past 09:20 ET does the work and stamps
        # the date, and the other sees the stamp and exits. Arbitrary lateness
        # is tolerated, an early winter firing at 08:50 ET is not, and a run
        # that fails leaves no stamp so the other entry retries it.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/New_York date +%F)
          now=$(TZ=America/New_York date +%H%M)
          mins=$(( 10#${now:0:2} * 60 + 10#${now:2:2} ))
          last=$(cat state/last-run.txt 2>/dev/null || echo "never")
          echo "Eastern time now: $today ${now:0:2}:${now:2:2} (last run: $last)"
          if [ "$last" = "$today" ]; then
            echo "Already ran today — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$mins" -lt 560 ]; then      # before 09:20 ET
            echo "Too early for the 09:50 ET slot — leaving it to the later entry."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.proceed == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.window.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run the monitor
        if: steps.window.outputs.proceed == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python -m oversold_monitor run --summary \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.always_notify && '--always-notify' || '' }}

      - name: Persist alert state
        # Without this the cooldown resets every run and you get the same
        # alert every weekday for as long as the condition lasts.
        if: always() && steps.window.outputs.proceed == 'true'
        run: |
          TZ=America/New_York date +%F > state/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --staged --quiet; then
            echo "No state change to record."
          else
            git commit -m "chore: record oversold alert state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload the report
        if: always() && steps.window.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oversold-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
