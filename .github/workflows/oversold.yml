name: Oversold monitor

on:
  schedule:
    # 22:15 UTC on weekdays — after the US close in both EDT (18:15 ET) and
    # EST (17:15 ET), so it needs no daylight-saving adjustment.
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the cooldown and re-send every current alert'
        type: boolean
        default: false
      always_notify:
        description: 'Send a message even when nothing is oversold'
        type: boolean
        default: false

concurrency:
  group: oversold-monitor
  cancel-in-progress: false

permissions:
  contents: write        # needed to commit the alert state back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python -m oversold_monitor run --summary \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.always_notify && '--always-notify' || '' }}

      - name: Persist alert state
        # Without this the cooldown resets every run and you get the same
        # alert every weekday for as long as the condition lasts.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --staged --quiet; then
            echo "No state change to record."
          else
            git commit -m "chore: record oversold alert state [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oversold-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
