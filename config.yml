  - {name: GBP.USD, symbol: GBPUSD=X, asset_class: fx}
  - {name: USD.JPY, symbol: JPY=X,    asset_class: fx}
  - {name: CL,      symbol: CL=F,     asset_class: futures}

# ---------------------------------------------------------------------------
# What counts as oversold. Loosen `score_alert` for more alerts, raise it for
# fewer. RSI <= 30 is the classic line; <= 20 is genuinely rare.
# ---------------------------------------------------------------------------
thresholds:
  rsi_period: 14
  rsi_oversold: 30
  rsi_deep: 20
  rsi_exit: 45          # an alert is "recovered" once RSI closes back above this
  stoch_oversold: 20
  williams_oversold: -80
  cci_oversold: -100
  mfi_oversold: 20
  percent_b_oversold: 0.05
  score_alert: 55       # composite 0-100 needed to notify
  score_deep: 78        # composite that counts as deeply oversold

# Relative pull of each indicator on the composite score.
weights:
  rsi: 34
  stochastic: 16
  williams: 12
  percent_b: 16
  cci: 10
  mfi: 12

lookback_days: 400      # enough history for a 200-day SMA and 52-week high
cooldown_days: 5        # don't repeat the same alert more often than this
notify_recovery: true   # also tell me when something climbs back out

# The scan runs at 09:50 ET, 20 minutes into the session, when today's daily
# bar is only partly formed and its RSI can swing on the opening print. With
# this on, indicators use completed sessions only: stable readings, one
# session behind. Set false to score the live, in-progress bar instead.
exclude_partial_bar: true
state_path: state/alerts.json
report_dir: reports

# ---------------------------------------------------------------------------
# Where alerts go. Delete or set `enabled: false` on the ones you don't want.
# Secrets are read from the environment via ${VAR} — never hard-code them.
# ---------------------------------------------------------------------------
notifiers:
  - type: console
    enabled: true

  - type: file
    enabled: true
    directory: reports

  # Phone push, no account needed: install the ntfy app, subscribe to a topic,
  # then put that topic here. Pick something unguessable — topics are public.
  - type: ntfy
    enabled: false
    topic: ${NTFY_TOPIC}
    priority: high

  # Gmail needs an App Password (Google Account -> Security -> App passwords).
  - type: email
    enabled: false
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_USERNAME}
    to:
      - ${ALERT_EMAIL}

  - type: webhook
    enabled: false
    url: ${WEBHOOK_URL}
    format: discord      # slack | discord | json

  - type: github_summary
    enabled: true
